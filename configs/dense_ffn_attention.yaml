model_name: dense_ffn_attention
input_dim: 4096
num_modes: 4
hidden_dim: 1024
expert_ffn_dim: 2048
num_labels: 3
dropout: 0.2

use_relation_contrastive_loss: false
relation_contrastive_margin: 0.5
relation_contrastive_loss_coef: 0.0
use_mode_auxiliary_loss: false
mode_auxiliary_loss_coef: 0.0
use_invariance_loss: false
invariance_loss_coef: 0.0
reliability_weighted_invariance: false
aux_loss_coef: 0.0

seed: 42
batch_size: 16
num_workers: 0
num_epochs: 30
learning_rate: 0.00005
weight_decay: 0.01
label_smoothing: 0.0
scheduler_name: cosine_with_warmup
scheduler_warmup_ratio: 0.03
scheduler_min_learning_rate: 0.000001
patience: 7

feature_source: sonar
feature_sources:
  sonar:
    train: Features/sonar_16k/train.pt
    dev: Features/sonar_16k/dev.pt
    test: Features/sonar_16k/test.pt
  phobert_xlsr:
    train: Features/phobert_xlmr/train.pt
    dev: Features/phobert_xlmr/dev.pt
    test: Features/phobert_xlmr/test.pt
output_dir: outputs/dense_ffn_attention/{feature_source}
